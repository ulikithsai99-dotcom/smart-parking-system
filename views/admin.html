<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Smart Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
:root {
  --bg:#04080f; --surface:rgba(255,255,255,0.04); --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --primary:#2563eb; --cyan:#06b6d4; --text:#f0f4ff; --text-sub:#94a3b8; --text-muted:#64748b;
  --radius:20px; --radius-sm:12px; --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}

body {
  min-height:100vh; background:var(--bg); color:var(--text);
  display:flex; align-items:center; justify-content:center; padding:20px;
  overflow:hidden;
}
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 30% 20%, rgba(37,99,235,0.15) 0%, transparent 65%),
    radial-gradient(ellipse 50% 50% at 75% 80%, rgba(124,58,237,0.1) 0%, transparent 60%);
}
body::after {
  content:''; position:fixed; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:60px 60px; pointer-events:none;
}

.card {
  position:relative; z-index:1;
  width:100%; max-width:440px;
  padding:48px 44px;
  background:rgba(6,12,24,0.92);
  border:1px solid var(--border2);
  border-radius:28px;
  backdrop-filter:blur(40px);
  box-shadow: 0 0 0 1px rgba(37,99,235,0.08), 0 30px 70px rgba(0,0,0,0.65), 0 0 100px rgba(37,99,235,0.07);
  animation: fadeUp 0.5s ease both;
  overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(59,130,246,0.7), transparent);
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

.card-icon {
  width:72px; height:72px; border-radius:20px; margin:0 auto 28px;
  background:linear-gradient(135deg, rgba(37,99,235,0.2), rgba(6,182,212,0.15));
  border:1px solid rgba(59,130,246,0.3);
  display:flex; align-items:center; justify-content:center; font-size:2rem;
  box-shadow:0 0 40px rgba(37,99,235,0.2);
  animation:float 4s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

.card h1 {
  text-align:center; font-size:1.8rem; font-weight:800;
  letter-spacing:-0.03em; margin-bottom:6px;
}
.card .subtitle {
  text-align:center; color:var(--text-sub); font-size:0.9rem; margin-bottom:36px;
}

.field-wrap { margin-bottom:16px; }
.field-label {
  display:block; font-size:0.75rem; font-weight:600;
  color:var(--text-sub); letter-spacing:0.05em;
  text-transform:uppercase; margin-bottom:8px;
}
.field-input {
  width:100%; padding:13px 16px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  color:var(--text); font-size:0.95rem;
  font-family:'Inter',sans-serif;
  outline:none; transition:var(--transition);
}
.field-input::placeholder { color:var(--text-muted); }
.field-input:focus {
  border-color:#3b82f6;
  background:rgba(59,130,246,0.06);
  box-shadow:0 0 0 3px rgba(59,130,246,0.12);
}

.submit-btn {
  width:100%; padding:14px; margin-top:8px;
  background:linear-gradient(135deg, var(--primary), var(--cyan));
  border:none; border-radius:var(--radius-sm);
  color:white; font-size:1rem; font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer; transition:var(--transition);
  position:relative; overflow:hidden; letter-spacing:0.01em;
}
.submit-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(rgba(255,255,255,0.15), transparent);
  opacity:0; transition:var(--transition);
}
.submit-btn:hover { transform:translateY(-2px); box-shadow:0 10px 35px rgba(37,99,235,0.5); }
.submit-btn:hover::before { opacity:1; }

.divider { border:none; border-top:1px solid var(--border); margin:24px 0; }

.register-link {
  text-align:center; font-size:0.85rem; color:var(--text-muted);
}
.register-link a {
  color:#60a5fa; text-decoration:none; font-weight:600;
  transition:var(--transition);
}
.register-link a:hover { color:#93c5fd; }

.back-link {
  display:flex; align-items:center; justify-content:center; gap:6px;
  margin-top:16px; color:var(--text-muted); text-decoration:none;
  font-size:0.83rem; font-weight:500; transition:var(--transition);
}
.back-link:hover { color:var(--text-sub); }

.register-panel {
  margin-top:20px;
  padding:20px;
  background:rgba(37,99,235,0.06);
  border:1px solid rgba(59,130,246,0.15);
  border-radius:14px;
  display:none;
}
.register-panel.open { display:block; }
.register-panel h3 { font-size:0.95rem; font-weight:700; margin-bottom:14px; color:#93c5fd; }

.toggle-register {
  background:none; border:1px solid var(--border2); color:var(--text-sub);
  width:100%; padding:11px; border-radius:var(--radius-sm);
  font-size:0.85rem; font-weight:600; font-family:'Inter',sans-serif;
  cursor:pointer; margin-top:12px; transition:var(--transition);
}
.toggle-register:hover { background:var(--surface2); color:var(--text); transform:none; box-shadow:none; }
</style>
</head>
<body>

<div class="card">
  <div class="card-icon">🔐</div>
  <h1>Admin Portal</h1>
  <p class="subtitle">Sign in to access the control dashboard</p>

  <form action="/adminLogin" method="POST">
    <div class="field-wrap">
      <label class="field-label">Username</label>
      <input class="field-input" type="text" name="username" placeholder="Enter your username" required autocomplete="username">
    </div>
    <div class="field-wrap">
      <label class="field-label">Password</label>
      <input class="field-input" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit-btn">Sign In →</button>
  </form>

  <hr class="divider">

  <button class="toggle-register" onclick="document.getElementById('regPanel').classList.toggle('open'); this.textContent = document.getElementById('regPanel').classList.contains('open') ? '— Close Registration' : '+ Register New Admin'">
    + Register New Admin
  </button>

  <div class="register-panel" id="regPanel">
    <h3>Create Admin Account</h3>
    <form action="/createAdmin" method="POST">
      <div class="field-wrap">
        <input class="field-input" type="text" name="username" placeholder="New username" required style="margin-bottom:10px;">
      </div>
      <div class="field-wrap">
        <input class="field-input" type="password" name="password" placeholder="New password" required>
      </div>
      <button type="submit" class="submit-btn" style="background:linear-gradient(135deg,#059669,#10b981); margin-top:8px;">Create Account</button>
    </form>
  </div>

  <a href="/user" class="back-link">← Back to User Portal</a>
</div>

</body>
</html>
