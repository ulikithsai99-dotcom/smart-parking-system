<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="container">

    <div
    class="card"
    style="
    max-width:500px;
    margin:auto;
    margin-top:100px;
    ">

        <div class="title">
            <h1>🔐 Admin Portal</h1>
            <p>Login to access dashboard</p>
        </div>

        <form action="/adminLogin" method="POST">

            <div class="input-group">
                <input
                type="text"
                name="username"
                placeholder="Username"
                required>
            </div>

            <div class="input-group">
                <input
                type="password"
                name="password"
                placeholder="Password"
                required>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
