<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Reservation — Smart Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.page{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;position:relative;z-index:1;}
.glass-card{width:500px;max-width:100%;padding:48px 44px;border-radius:28px;background:rgba(8,14,30,.9);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(40px);box-shadow:0 0 0 1px rgba(37,99,235,.1),0 25px 60px rgba(0,0,0,.6);position:relative;overflow:hidden;}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.6),transparent);}
.icon-wrap{width:72px;height:72px;background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(139,92,246,.15));border:1px solid rgba(139,92,246,.3);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 24px;}
h1{font-size:1.75rem;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;text-align:center;}
.subtitle{color:#94a3b8;margin-bottom:32px;font-size:.95rem;text-align:center;}
.field-block{margin-bottom:16px;}
.field-label{display:block;font-size:.73rem;font-weight:600;color:#94a3b8;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
.field-input{width:100%;padding:13px 16px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.05);color:#f0f4ff;font-size:.95rem;font-family:Inter,sans-serif;outline:none;transition:.2s;}
.field-input::placeholder{color:#64748b;}
.field-input:focus{border-color:#8b5cf6;background:rgba(139,92,246,.06);box-shadow:0 0 0 3px rgba(139,92,246,.12);}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);border:none;border-radius:12px;color:white;font-size:1rem;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;transition:.2s;margin-top:8px;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 35px rgba(124,58,237,.45);}
.links{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px;}
.links a{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);color:#94a3b8;text-decoration:none;font-size:.875rem;font-weight:500;transition:.2s;}
.links a:hover{color:#f0f4ff;background:rgba(255,255,255,.05);}
.success-banner{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:14px 18px;margin-bottom:16px;color:#34d399;font-size:.9rem;font-weight:600;text-align:center;}
.error-banner{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#fca5a5;font-size:.85rem;font-weight:600;text-align:center;}
.hint-box{background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:10px;padding:10px 14px;font-size:.78rem;color:#c4b5fd;margin-bottom:18px;}
</style>
</head>
<body>
<div class="page">
  <div class="glass-card">
    <div class="icon-wrap">🏢</div>
    <h1>Staff Reservation</h1>
    <p class="subtitle">Reserve a dedicated parking slot in advance</p>

    <div id="successBanner" class="success-banner" style="display:none;"></div>
    <div id="errorBanner" class="error-banner" style="display:none;"></div>

    <div class="hint-box">
      💡 Zones: A (1–50) · B (51–100) · C (101–150) · D (151–200)
    </div>

    <form action="/reserveSlot" method="POST">
      <div class="field-block">
        <label class="field-label">Employee ID</label>
        <input class="field-input" type="text" name="employee_id" placeholder="e.g. EMP-001" required autocomplete="off">
      </div>
      <div class="field-block">
        <label class="field-label">Staff Name</label>
        <input class="field-input" type="text" name="name" placeholder="Full name" required>
      </div>
      <div class="field-block">
        <label class="field-label">Vehicle Number</label>
        <input class="field-input" type="text" name="vehicle" placeholder="e.g. MH12AB1234" required autocomplete="off" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="field-block">
        <label class="field-label">Slot Number (1–200)</label>
        <input class="field-input" type="number" name="slot" placeholder="Enter slot number" min="1" max="200" required>
      </div>
      <button type="submit" class="submit-btn">Reserve Slot →</button>
    </form>

    <div class="links">
      <a href="/user">← User Portal</a>
      <a href="/map">📍 Live Map</a>
      <a href="/reservations">📋 View All Reservations</a>
    </div>
  </div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
if(params.get('success')){
  const b=document.getElementById('successBanner');
  b.textContent=`✅ Slot ${params.get('slot')||''} reserved successfully!`;
  b.style.display='block';
}
if(params.get('error')==='duplicate'){
  const b=document.getElementById('errorBanner');
  b.textContent='❌ Employee ID already has an active reservation';
  b.style.display='block';
}
if(params.get('error')==='invalid'){
  const b=document.getElementById('errorBanner');
  b.textContent='❌ Invalid slot number. Must be between 1 and 200';
  b.style.display='block';
}
</script>
</body>
</html>
