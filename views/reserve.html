<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Reservation — Smart Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.glass-card { width:500px; }
.field-label {
  display:block; font-size:0.73rem; font-weight:600;
  color:#94a3b8; letter-spacing:0.05em; text-transform:uppercase;
  text-align:left; margin-bottom:6px;
}
.field-block { margin-bottom:14px; text-align:left; }
.glass-card input { margin-bottom:0; }
</style>
</head>
<body>
<div class="page">
  <div class="glass-card">
    <div class="icon-wrap">🏢</div>
    <h1>Staff Reservation</h1>
    <p>Reserve a dedicated parking slot in advance</p>

    <form action="/reserveSlot" method="POST">
      <div class="field-block">
        <label class="field-label">Employee ID</label>
        <input type="text" name="employee_id" placeholder="e.g. EMP-001" required autocomplete="off">
      </div>
      <div class="field-block">
        <label class="field-label">Staff Name</label>
        <input type="text" name="name" placeholder="Full name" required>
      </div>
      <div class="field-block">
        <label class="field-label">Vehicle Number</label>
        <input type="text" name="vehicle" placeholder="e.g. MH12AB1234" required autocomplete="off" style="text-transform:uppercase;">
      </div>
      <div class="field-block">
        <label class="field-label">Preferred Slot (1–200)</label>
        <input type="number" name="slot" placeholder="Slot number" min="1" max="200" required>
      </div>
      <button type="submit" style="margin-top:8px;">Reserve Slot →</button>
    </form>

    <div class="links" style="margin-top:20px;">
      <a href="/user">← User Portal</a>
      <a href="/map">📍 Live Map</a>
    </div>
  </div>
</div>
</body>
</html>
